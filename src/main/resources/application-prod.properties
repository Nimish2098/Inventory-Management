# Production Profile Configurations
# Hibernate strictly validates that the entities match the schema created by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging configuration: avoid leaking SQL and internal details
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.springframework.security=INFO
logging.level.com.miyuki=INFO

# Health check detail restriction
management.endpoint.health.show-details=never
